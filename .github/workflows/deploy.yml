name: Build and Push Frontend Image
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
      - name: Küçük harfli kullanıcı adı üret
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
   
      - name: Inject SSL Certificate for Build
        run: |
          mkdir -p ssl
          cat << 'EOF' > ssl/gurmepet.crt
          ${{ secrets.GURMEPET_CRT }}
          EOF
          
      - name: Verify certificate is valid
        run: |
          openssl x509 -in ssl/gurmepet.crt -noout -text > /dev/null
          echo "Sertifika geçerli formatta."

      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3
      - name: GitHub Container Registry'e Giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker İmajını Derle ve Yükle
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/gurmepet-frontend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/gurmepet-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sunucuya Bağlan ve Sistemi Güncelle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/projects/gurmepet-infrastructure
            sudo docker compose pull frontend
            sudo docker compose up -d